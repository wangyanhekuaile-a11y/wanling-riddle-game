<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万灵灯谜 · 猜灯谜互动游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0a0a2e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* 粒子背景 */
        #particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(138, 43, 226, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.4);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 标题文字效果 */
        .title-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #667eea 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* 开始界面 */
        .floating-lanterns {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
        }

        .floating-lantern {
            position: absolute;
            width: 80px;
            height: 120px;
            animation: floatLantern 8s ease-in-out infinite;
        }

        .floating-lantern .jf-bell {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 70px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5),
                        inset 0 -10px 20px rgba(0, 0, 0, 0.2);
        }

        .floating-lantern .jf-tentacles {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 50px;
        }

        .floating-lantern .jf-t {
            position: absolute;
            width: 3px;
            height: 40px;
            background: linear-gradient(to bottom, #ff6b6b 0%, #ff9f7a 100%);
            border-radius: 2px;
            animation: waveTentacle 2s ease-in-out infinite;
        }

        .floating-lantern .jf-t.t1 { left: 10px; }
        .floating-lantern .jf-t.t2 { left: 20px; animation-delay: 0.2s; }
        .floating-lantern .jf-t.t3 { left: 30px; animation-delay: 0.4s; }
        .floating-lantern .jf-t.t4 { left: 40px; animation-delay: 0.6s; }
        .floating-lantern .jf-t.t5 { left: 50px; animation-delay: 0.8s; }

        @keyframes floatLantern {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes waveTentacle {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        /* 万灵灯造型 */
        .lantern-hero {
            position: relative;
            width: 200px;
            height: 280px;
            margin: 0 auto;
            animation: glow 3s ease-in-out infinite;
        }

        .lantern-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
        }

        @keyframes glow {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.2);
            }
        }

        .wanling-lamp {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .lamp-chain {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .chain-link {
            width: 12px;
            height: 12px;
            border: 2px solid #ffd93d;
            border-radius: 50%;
            background: transparent;
        }

        .lamp-crown {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 30px;
        }

        .crown-peak {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            background: linear-gradient(135deg, #ffd93d 0%, #ff6b6b 100%);
            border-radius: 50% 50% 0 0;
        }

        .crown-ornament {
            position: absolute;
            top: 10px;
            width: 25px;
            height: 15px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            border-radius: 50%;
        }

        .crown-ornament.left {
            left: 5px;
        }

        .crown-ornament.right {
            right: 5px;
        }

        .lamp-arms {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 60px;
        }

        .lamp-arm {
            position: absolute;
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #ffd93d 0%, #ff6b6b 100%);
            border-radius: 50%;
        }

        .lamp-arm.left {
            left: 0;
            transform: rotate(-15deg);
        }

        .lamp-arm.right {
            right: 0;
            transform: rotate(15deg);
        }

        .arm-curl {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background: #ffd93d;
            border-radius: 50%;
        }

        .lamp-core {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.6),
                        inset 0 0 30px rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: coreGlow 2s ease-in-out infinite;
        }

        @keyframes coreGlow {
            0%, 100% {
                box-shadow: 0 0 50px rgba(102, 126, 234, 0.6),
                            inset 0 0 30px rgba(255, 255, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 70px rgba(102, 126, 234, 0.8),
                            inset 0 0 40px rgba(255, 255, 255, 0.5);
            }
        }

        .core-outer-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 3px solid #ffd93d;
            border-radius: 50%;
            animation: rotateRing 10s linear infinite;
        }

        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .core-inner-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, transparent 70%);
            border-radius: 50%;
        }

        .core-rune-ring {
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: rotateRing 15s linear infinite reverse;
        }

        .lamp-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            z-index: 10;
        }

        .core-particles {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
        }

        .core-particles span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd93d;
            border-radius: 50%;
            animation: particleFloat 3s ease-in-out infinite;
        }

        .core-particles span:nth-child(1) { top: 0; left: 50%; animation-delay: 0s; }
        .core-particles span:nth-child(2) { top: 25%; right: 0; animation-delay: 0.5s; }
        .core-particles span:nth-child(3) { bottom: 25%; right: 0; animation-delay: 1s; }
        .core-particles span:nth-child(4) { bottom: 0; left: 50%; animation-delay: 1.5s; }
        .core-particles span:nth-child(5) { bottom: 25%; left: 0; animation-delay: 2s; }
        .core-particles span:nth-child(6) { top: 25%; left: 0; animation-delay: 2.5s; }

        @keyframes particleFloat {
            0%, 100% {
                transform: translateY(0px);
                opacity: 1;
            }
            50% {
                transform: translateY(-10px);
                opacity: 0.5;
            }
        }

        .lamp-base {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 50px;
        }

        .base-ring {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 15px;
            background: linear-gradient(135deg, #ffd93d 0%, #ff6b6b 100%);
            border-radius: 50%;
        }

        .lamp-pendants {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 35px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }

        .pendant {
            width: 20px;
            height: 25px;
            background: linear-gradient(to bottom, #ff6b6b 0%, #ffd93d 100%);
            border-radius: 50% 50% 20% 20%;
            animation: swingPendant 2s ease-in-out infinite;
        }

        .pendant.center {
            height: 30px;
            animation-delay: 0.5s;
        }

        @keyframes swingPendant {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        /* 难度选择按钮 */
        .difficulty-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 25px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .difficulty-btn:hover {
            background: rgba(138, 43, 226, 0.3);
            border-color: #8A2BE2;
            transform: translateY(-2px);
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* 设置开关 */
        .setting-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .setting-toggle input {
            display: none;
        }

        .setting-toggle span {
            color: #a0a0a0;
            font-size: 0.9rem;
        }

        .setting-toggle input:checked + span {
            color: #667eea;
        }

        /* 开始按钮 */
        .start-button {
            position: relative;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
        }

        .btn-glow {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: btnShine 2s infinite;
        }

        @keyframes btnShine {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        /* 游戏主界面 */
        .game-header {
            background: rgba(10, 10, 46, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(138, 43, 226, 0.3);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
        }

        .header-lantern-icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .timer-stat {
            color: #667eea;
        }

        .progress-bar-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        /* 音效开关按钮 */
        .sound-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sound-toggle-btn:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        /* 灯谜展示区 */
        .riddle-card {
            background: linear-gradient(135deg, rgba(26, 26, 78, 0.8) 0%, rgba(26, 26, 78, 0.9) 100%);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px;
            padding: 40px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .card-lantern-left,
        .card-lantern-right {
            position: absolute;
            top: -30px;
            width: 40px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .card-lantern-left {
            left: 20px;
        }

        .card-lantern-right {
            right: 20px;
        }

        .riddle-difficulty-tag {
            position: absolute;
            top: 10px;
            right: 20px;
            padding: 5px 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .riddle-face-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .riddle-text {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
            line-height: 1.6;
        }

        .riddle-category {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 30px;
        }

        /* 提示区域 */
        .hint-area {
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
        }

        .hint-content {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffd93d;
        }

        /* 答案输入区 */
        .answer-area {
            margin-bottom: 20px;
        }

        .answer-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .answer-input {
            flex: 1;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 25px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .answer-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .submit-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .action-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 20px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(138, 43, 226, 0.2);
            transform: translateY(-2px);
        }

        .action-btn.hint-btn {
            border-color: rgba(255, 215, 0, 0.5);
        }

        .action-btn.hint-btn:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        /* 答题反馈弹窗 */
        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .feedback-card {
            background: linear-gradient(135deg, rgba(26, 26, 78, 0.95) 0%, rgba(26, 26, 78, 0.98) 100%);
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            animation: fadeInScale 0.3s ease;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .feedback-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .feedback-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .feedback-answer {
            font-size: 1.2rem;
            color: #ffd93d;
            margin-bottom: 15px;
        }

        .feedback-score {
            font-size: 1rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .next-btn {
            padding: 12px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* 结算界面 */
        .result-lantern {
            position: relative;
            width: 150px;
            height: 200px;
            margin: 0 auto;
        }

        .result-wanling-lamp {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .result-lamp-crown {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 20px;
            background: linear-gradient(135deg, #ffd93d 0%, #ff6b6b 100%);
            border-radius: 50%;
        }

        .result-lamp-arms {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 40px;
        }

        .result-arm-l,
        .result-arm-r {
            position: absolute;
            width: 35px;
            height: 30px;
            background: linear-gradient(135deg, #ffd93d 0%, #ff6b6b 100%);
            border-radius: 50%;
        }

        .result-arm-l {
            left: 0;
            transform: rotate(-15deg);
        }

        .result-arm-r {
            right: 0;
            transform: rotate(15deg);
        }

        .result-lamp-core {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.6);
        }

        .result-core-glow {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid #ffd93d;
            border-radius: 50%;
            animation: rotateRing 8s linear infinite;
        }

        .result-lantern-text {
            font-size: 2rem;

            particlesBg: document.getElementById('particles-bg')
        };

        // 初始化粒子背景
        function initParticles() {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                elements.particlesBg.appendChild(particle);
            }
        }

        // 初始化难度选择
        function initDifficultySelection() {
            elements.difficultyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    elements.difficultyBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.difficulty = btn.dataset.difficulty;
                });
            });
        }

        // 初始化设置
        function initSettings() {
            elements.timerToggle.addEventListener('change', (e) => {
                gameState.isTimerEnabled = e.target.checked;
            });

            elements.soundToggle.addEventListener('change', (e) => {
                gameState.isSoundEnabled = e.target.checked;
                updateSoundButton();
            });
        }

        // 更新音效按钮
        function updateSoundButton() {
            const icon = elements.soundBtn.querySelector('i');
            if (gameState.isSoundEnabled) {
                icon.className = 'fas fa-volume-high';
            } else {
                icon.className = 'fas fa-volume-xmark';
            }
        }

        // 音效按钮点击
        elements.soundBtn.addEventListener('click', () => {
            gameState.isSoundEnabled = !gameState.isSoundEnabled;
            elements.soundToggle.checked = gameState.isSoundEnabled;
            updateSoundButton();
        });

        // 开始游戏
        function startGame() {
            gameState.currentRiddleIndex = 0;
            gameState.score = 0;
            gameState.combo = 0;
            gameState.maxCombo = 0;
            gameState.correctCount = 0;
            gameState.hintCount = 3;
            gameState.currentRiddles = [...riddles[gameState.difficulty]];
            
            // 随机打乱题目
            shuffleArray(gameState.currentRiddles);
            
            // 切换界面
            elements.startScreen.classList.add('hidden');
            elements.gameScreen.classList.remove('hidden');
            
            // 显示计时器
            if (gameState.isTimerEnabled) {
                elements.timerDisplay.style.display = 'flex';
            } else {
                elements.timerDisplay.style.display = 'none';
            }
            
            // 加载第一题
            loadRiddle();
        }

        // 打乱数组
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 加载灯谜
        function loadRiddle() {
            if (gameState.currentRiddleIndex >= gameState.currentRiddles.length) {
                endGame();
                return;
            }

            const riddle = gameState.currentRiddles[gameState.currentRiddleIndex];
            
            // 更新谜面
            elements.riddleText.textContent = riddle.question;
            elements.riddleCategoryText.textContent = riddle.category;
            
            // 更新难度标签
            updateDifficultyLabel();
            
            // 更新进度
            updateProgress();
            
            // 重置输入框
            elements.answerInput.value = '';
            elements.answerInput.focus();
            
            // 隐藏提示
            elements.hintArea.classList.add('hidden');
            
            // 更新提示次数
            elements.hintCount.textContent = gameState.hintCount;
            
            // 启动计时器
            if (gameState.isTimerEnabled) {
                startTimer();
            }
        }

        // 更新难度标签
        function updateDifficultyLabel() {
            const labels = {
                easy: '<i class="fas fa-star"></i> 简单',
                medium: '<i class="fas fa-star"></i><i class="fas fa-star"></i> 中等',
                hard: '<i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i> 困难'
            };
            elements.riddleDifficulty.innerHTML = labels[gameState.difficulty];
        }

        // 更新进度
        function updateProgress() {
            const current = gameState.currentRiddleIndex + 1;
            const total = gameState.currentRiddles.length;
            elements.progressText.textContent = `${current}/${total}`;
            elements.progressBar.style.width = `${(current / total) * 100}%`;
        }

        // 启动计时器
        function startTimer() {
            gameState.timeLeft = 30;
            elements.timerText.textContent = gameState.timeLeft;
            
            if (gameState.timer) {
                clearInterval(gameState.timer);
            }
            
            gameState.timer = setInterval(() => {
                gameState.timeLeft--;
                elements.timerText.textContent = gameState.timeLeft;
                
                if (gameState.timeLeft <= 10) {
                    elements.timerText.style.color = '#ff6b6b';
                } else {
                    elements.timerText.style.color = '';
                }
                
                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timer);
                    showFeedback(false);
                }
            }, 1000);
        }

        // 提交答案
        function submitAnswer() {
            const userAnswer = elements.answerInput.value.trim();
            if (!userAnswer) return;
            
            const correctAnswer = gameState.currentRiddles[gameState.currentRiddleIndex].answer;
            const isCorrect = userAnswer === correctAnswer;
            
            clearInterval(gameState.timer);
            
            if (isCorrect) {
                gameState.correctCount++;
                gameState.combo++;
                gameState.maxCombo = Math.max(gameState.maxCombo, gameState.combo);
                
                const baseScore = 10;
                const comboBonus = Math.floor(gameState.combo / 3) * 2;
                gameState.score += baseScore + comboBonus;
            } else {
                gameState.combo = 0;
            }
            
            updateScore();
            showFeedback(isCorrect);
        }

        // 更新分数显示
        function updateScore() {
            elements.scoreText.textContent = gameState.score;
            elements.comboText.textContent = `x${gameState.combo}`;
        }

        // 显示反馈
        function showFeedback(isCorrect) {
            const riddle = gameState.currentRiddles[gameState.currentRiddleIndex];
            
            elements.feedbackOverlay.classList.remove('hidden');
            
            if (isCorrect) {
                elements.feedbackIcon.innerHTML = '<i class="fas fa-check-circle" style="color: #4ade80;"></i>';
                elements.feedbackTitle.textContent = '回答正确！';
                elements.feedbackTitle.style.color = '#4ade80';
                elements.feedbackAnswer.textContent = `正确答案：${riddle.answer}`;
                
                const baseScore = 10;
                const comboBonus = Math.floor(gameState.combo / 3) * 2;
                const totalScore = baseScore + comboBonus;
                elements.feedbackScore.textContent = `+${totalScore} 分`;
                elements.feedbackScore.style.color = '#4ade80';
            } else {
                elements.feedbackIcon.innerHTML = '<i class="fas fa-times-circle" style="color: #f87171;"></i>';
                elements.feedbackTitle.textContent = '回答错误';
                elements.feedbackTitle.style.color = '#f87171';
                elements.feedbackAnswer.textContent = `正确答案：${riddle.answer}`;
                elements.feedbackScore.textContent = '继续加油！';
                elements.feedbackScore.style.color = '#f87171';
            }
        }

        // 下一题
        function nextRiddle() {
            elements.feedbackOverlay.classList.add('hidden');
            gameState.currentRiddleIndex++;
            loadRiddle();
        }

        // 显示提示
        function showHint() {
            if (gameState.hintCount <= 0) return;
            
            const riddle = gameState.currentRiddles[gameState.currentRiddleIndex];
            elements.hintText.textContent = riddle.hint;
            elements.hintArea.classList.remove('hidden');
            
            gameState.hintCount--;
            elements.hintCount.textContent = gameState.hintCount;
        }

        // 跳过题目
        function skipRiddle() {
            clearInterval(gameState.timer);
            gameState.combo = 0;
            updateScore();
            
            elements.feedbackOverlay.classList.remove('hidden');
            
            const riddle = gameState.currentRiddles[gameState.currentRiddleIndex];
            elements.feedbackIcon.innerHTML = '<i class="fas fa-forward" style="color: #ffd93d;"></i>';
            elements.feedbackTitle.textContent = '已跳过';
            elements.feedbackTitle.style.color = '#ffd93d';
            elements.feedbackAnswer.textContent = `正确答案：${riddle.answer}`;
            elements.feedbackScore.textContent = '这道题暂时跳过';
            elements.feedbackScore.style.color = '#ffd93d';
        }

        // 结束游戏
        function endGame() {
            clearInterval(gameState.timer);
            
            elements.gameScreen.classList.add('hidden');
            elements.resultScreen.classList.remove('hidden');
            
            // 计算统计数据
            const totalRiddles = gameState.currentRiddles.length;
            const accuracy = Math.round((gameState.correctCount / totalRiddles) * 100);
            
            // 更新结果显示
            elements.resultScore.textContent = gameState.score;
            elements.resultCorrect.textContent = gameState.correctCount;
            elements.resultCombo.textContent = gameState.maxCombo;
            elements.resultAccuracy.textContent = accuracy + '%';
            
            // 计算等级和称号
            const { grade, title } = calculateGradeAndTitle(gameState.score, accuracy, totalRiddles);
            
            elements.resultGrade.textContent = grade;
            elements.resultTitle.textContent = title;
            
            // 烟花效果
            createFireworks();
        }

        // 计算等级和称号
        function calculateGradeAndTitle(score, accuracy, totalRiddles) {
            const maxScore = totalRiddles * 10;
            const percentage = score / maxScore;
            
            let grade, title;
            
            if (percentage >= 0.9 && accuracy >= 90) {
                grade = 'S';
                title = '万灵灯王';
            } else if (percentage >= 0.8 && accuracy >= 80) {
                grade = 'A';
                title = '灯谜大师';
            } else if (percentage >= 0.6 && accuracy >= 60) {
                grade = 'B';
                title = '灯谜高手';
            } else if (percentage >= 0.4 && accuracy >= 40) {
                grade = 'C';
                title = '灯谜能手';
            } else if (percentage >= 0.2 && accuracy >= 20) {
                grade = 'D';
                title = '灯谜学徒';
            } else {
                grade = 'E';
                title = '灯谜新手';
            }
            
            return { grade, title };
        }

        // 创建烟花效果
        function createFireworks() {
            const container = document.getElementById('result-fireworks');
            container.innerHTML = '';
            
            for (let i = 0; i < 30; i++) {
                const firework = document.createElement('div');
                firework.style.cssText = `
                    position: absolute;
                    width: 4px;
                    height: 4px;
                    background: hsl(${Math.random() * 360}, 100%, 50%);
                    border-radius: 50%;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    animation: firework ${Math.random() * 2 + 1}s ease-out forwards;
                `;
                container.appendChild(firework);
            }
            
            // 添加烟花动画
            const style = document.createElement('style');
            style.textContent = `
                @keyframes firework {
                    0% {
                        transform: scale(1);
                        opacity: 1;
                    }
                    100% {
                        transform: scale(20);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        }

        // 重新开始
        function restartGame() {
            elements.resultScreen.classList.add('hidden');
            elements.startScreen.classList.remove('hidden');
        }

        // 返回首页
        function goHome() {
            elements.resultScreen.classList.add('hidden');
            elements.startScreen.classList.remove('hidden');
        }

        // 事件监听
        elements.startBtn.addEventListener('click', startGame);
        elements.submitBtn.addEventListener('click', submitAnswer);
        elements.nextBtn.addEventListener('click', nextRiddle);
        elements.hintBtn.addEventListener('click', showHint);
        elements.skipBtn.addEventListener('click', skipRiddle);
        elements.restartBtn.addEventListener('click', restartGame);
        elements.homeBtn.addEventListener('click', goHome);

        // 回车键提交
        elements.answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitAnswer();
            }
        });

        // 初始化
        initParticles();
        initDifficultySelection();
        initSettings();
    </script>
</body>
</html>
